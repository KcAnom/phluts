name: all_plugins

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**.md'

jobs:
  analyze:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Run Analyze'
        run: melos run analyze

  pub_get_check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Flutter Pub Get'
        run: melos run get

  # Runs on Linux, so this is also what catches paths whose casing only works
  # on a case-insensitive filesystem — the analyze and format jobs never touch
  # the platform directories or the asset bundle.
  build_playground:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Build web'
        run: flutter build web
        working-directory: phluts_playground
      - name: 'Test'
        run: flutter test
        working-directory: phluts_playground

  # The extension's 10 test files were wired into no CI job at all, which is
  # how a preview path that could never resolve its own output shipped with a
  # green test beside it. Electron needs a display, hence xvfb on Linux.
  vscode_extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/phluts-vscode
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 'Install'
        run: npm ci
      - name: 'Widget catalog is not stale'
        # `compile` regenerates this, so a stale committed copy is invisible
        # locally; only `watch` and the committed artifact drift.
        run: |
          npm run generate:catalog
          git diff --exit-code src/generated/widgetCatalog.ts
      - name: 'Test'
        run: xvfb-run -a npm test

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      # Pinned deliberately: dart_style output shifts between stable releases,
      # so a floating channel re-reds this job on the next Flutter bump with no
      # source change. The tree was formatted with Flutter 3.38.7 / Dart 3.10.7.
      - uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true
      - uses: bluefireteam/melos-action@dd3c344d731938d2ab2567a261f54a19a68b5f6a
        with:
          melos-version: '3.0.1'
      - name: 'Dart format'
        run: |
          melos run format
          ./.github/workflows/scripts/validate-formatting.sh